services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudlens-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cloudlens.db
      - ENVIRONMENT=production
    volumes:
      - backend-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudlens-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  backend-data:
